<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필봉 키클 독서퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 키클 한마당 포스터처럼 살구색 바탕 위에 둥근 흰 카드를 세로로 쌓는 한 화면짜리 앱 (포스터 느낌을 살리려고 밝은 테마 하나로 고정) */
:root {
  color-scheme: light;
  --peach: #FFE6C4;
  --card: #FFFFFF;
  --ink: #3A2412;
  --ink-soft: #7A5B44;
  --teal: #1A9AAE;
  --blue: #05A6E3;
  --blue-soft: #E1F4FC;
  --red: #EF5249;
  --red-soft: #FDE6E3;
  --green: #3FA874;
  --green-soft: #E2F5EA;
  --pinkchip: #E79AF0;
  --lemon: #FBF59B;
  --tile-pink: #F3B5F8;
  --tile-yellow: #FFF27A;
  --tile-rose: #FFBDC2;
  --tile-sky: #C3E2FF;
  --tile-lime: #C8EDAA;
  --violet: #D45FE0;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r-card: 28px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--peach);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* 머리말 */
.made-by { text-align: center; font-family: var(--display); font-size: 1.25rem; display: flex; justify-content: center; align-items: center; gap: .4em; flex-wrap: wrap; }
.ras { font-size: 1.9rem; letter-spacing: -.02em; line-height: 1; }
.ras .r { color: var(--blue); } .ras .a { color: var(--red); } .ras .s { color: var(--green); }
.tiles { display: flex; justify-content: center; align-items: center; gap: clamp(10px, 3vw, 28px); flex-wrap: wrap; }
.tile-group { display: flex; }
.tile {
  font-family: var(--display); color: var(--ink);
  font-size: clamp(2.4rem, 10vw, 4.6rem); line-height: 1;
  width: clamp(64px, 16vw, 118px); aspect-ratio: 1; max-width: 100%;
  display: grid; place-items: center; border-radius: 26%;
  margin-inline: -4px;
}
.tile:nth-child(odd) { transform: rotate(-5deg); }
.tile:nth-child(even) { transform: rotate(6deg) translateY(6px); }
.t1 { background: var(--tile-pink); } .t2 { background: var(--tile-yellow); }
.t3 { background: var(--tile-rose); } .t4 { background: var(--tile-sky); }
.t5 { background: var(--tile-lime); } .t6 { background: var(--tile-yellow); }
.pilbong { font-family: var(--display); font-size: 1.1rem; background: var(--teal); color: var(--card); padding: .25em .8em; border-radius: 999px; }

/* 카드 */
.card { background: var(--card); border: 3px solid var(--teal); border-radius: var(--r-card); padding: 22px clamp(16px, 4vw, 28px); }
.chip { font-family: var(--display); display: inline-block; padding: .12em .5em; border-radius: 6px; color: var(--card); line-height: 1.2; }
.chip.pink { background: var(--pinkchip); }
.chip.blue { background: var(--blue); }
.h { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }

/* 도서 소개 카드 */
.book { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; align-items: center; }
.bigR { grid-row: span 2; display: flex; flex-direction: column; align-items: center; font-family: var(--display); color: var(--blue); }
.bigR b { font-size: 5.4rem; line-height: .9; font-weight: 400; }
.bigR span { font-size: 1.5rem; }
.book-chips { display: flex; gap: 8px; flex-wrap: wrap; font-size: 1.7rem; }
.book-title { font-size: clamp(1.25rem, 4vw, 1.6rem); }
.rules { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.rule { background: var(--blue-soft); border-radius: 14px; padding: 10px 8px; text-align: center; font-family: var(--display); font-size: 1.05rem; line-height: 1.35; }
.rule small { display: block; font-family: var(--body); font-size: .85rem; color: var(--ink-soft); }

/* 입력 */
.form { display: flex; flex-direction: column; gap: 18px; }
.field-label { font-family: var(--display); font-size: 1.2rem; margin-bottom: 8px; display: block; }
.pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.pick.cls { grid-template-columns: repeat(3, 1fr); }
.pick button:disabled { cursor: default; opacity: 1; }
.pick button {
  font-family: var(--display); font-size: 1.2rem; padding: 10px 0;
  background: var(--card); border: 2px solid var(--tile-sky); border-radius: 14px;
}
.pick button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--card); }
.name-input { width: 100%; font-family: var(--display); font-size: 1.4rem; padding: 12px 16px; border: 2px solid var(--tile-sky); border-radius: 14px; background: var(--card); }
.name-input:focus { border-color: var(--blue); outline: none; }
.big-btn {
  font-family: var(--display); font-size: 1.6rem; border: 0; border-radius: 18px;
  padding: 14px 20px; background: var(--blue); color: var(--card);
  box-shadow: 0 5px 0 #0383B4; transition: transform .08s;
}
.big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #0383B4; }
.big-btn.green { background: var(--green); box-shadow: 0 5px 0 #2D8259; }
.big-btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--teal); box-shadow: none; }
.big-btn:disabled { opacity: .45; cursor: default; }
.err { color: var(--red); font-family: var(--display); min-height: 1.3em; margin: -6px 0 0; }

/* 스티커 띠 */
.sticker-bar { background: var(--lemon); border-radius: var(--r-card); padding: 16px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.sticker-bar .txt { flex: 1; min-width: 0; }
.sticker-bar .h { color: var(--violet); font-size: 1.35rem; }
.sticker-bar p { margin: 2px 0 0; color: var(--violet); font-family: var(--display); }
.link-btn { font-family: var(--display); font-size: 1.1rem; background: var(--card); border: 2px solid var(--violet); color: var(--violet); border-radius: 999px; padding: 8px 16px; }

/* 스티커 */
.stamp {
  width: 150px; aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  border: 5px solid var(--blue); box-shadow: inset 0 0 0 4px var(--card), inset 0 0 0 7px var(--tile-sky);
  background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--display); text-align: center; line-height: 1.1; flex: none;
}
.stamp .top { font-size: .7rem; color: var(--violet); }
.stamp .mid { display: flex; align-items: center; gap: 4px; margin: 4px 0; }
.stamp .mid b { font-size: 2.6rem; color: var(--blue); font-weight: 400; }
.stamp .mid span { font-size: 1.05rem; text-align: left; }
.stamp .date { font-size: .7rem; color: var(--ink-soft); }
.stamp.mini { width: 74px; border-width: 3px; box-shadow: inset 0 0 0 2px var(--card), inset 0 0 0 4px var(--tile-sky); }
.stamp.mini .mid b { font-size: 1.5rem; }
.stamp.mini .mid span { font-size: .62rem; }
.stamp.mini .top, .stamp.mini .date { font-size: .45rem; }

/* 퀴즈 */
.quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--display); }
.who { font-size: 1.15rem; }
.dots { display: flex; gap: 8px; }
.dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--tile-sky); font-size: 1rem; }
.dot.now { border-color: var(--blue); background: var(--blue); color: var(--card); }
.dot.ok { background: var(--green); border-color: var(--green); color: var(--card); }
.dot.no { background: var(--red); border-color: var(--red); color: var(--card); }
.q-label { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 1.15rem; flex-wrap: wrap; }
.q-type { font-family: var(--display); color: var(--ink-soft); font-size: 1rem; }
.q-text { font-size: clamp(1.4rem, 4.6vw, 1.9rem); line-height: 1.4; margin-bottom: 20px; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left;
  font-family: var(--display); font-size: clamp(1.15rem, 3.8vw, 1.4rem);
  padding: 14px 16px; border-radius: 16px; border: 3px solid transparent;
}
.opt .num { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 1.1rem; }
.opt:nth-child(4n+1) { background: var(--tile-pink); }
.opt:nth-child(4n+2) { background: var(--tile-yellow); }
.opt:nth-child(4n+3) { background: var(--tile-sky); }
.opt:nth-child(4n+4) { background: var(--tile-lime); }
.opt[aria-pressed="true"] { border-color: var(--ink); }
.opt.right { border-color: var(--green); box-shadow: 0 0 0 3px var(--green); }
.opt.wrong { border-color: var(--red); opacity: .75; }
.opt:disabled { cursor: default; }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.ox .opt { justify-content: center; font-size: 4rem; padding: 18px 0; }
.ox .opt:nth-child(1) { background: var(--blue-soft); color: var(--blue); }
.ox .opt:nth-child(2) { background: var(--red-soft); color: var(--red); }
.hint { color: var(--ink-soft); font-size: .95rem; margin: 10px 0 0; }
.actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
.actions .big-btn { flex: 1; }
.feedback { margin-top: 18px; border-radius: 18px; padding: 14px 18px; font-family: var(--display); font-size: 1.3rem; line-height: 1.4; }
.feedback.ok { background: var(--green-soft); color: var(--green); }
.feedback.no { background: var(--red-soft); color: var(--red); }
.feedback small { display: block; color: var(--ink); font-size: 1.05rem; }

/* 결과 */
.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.result .h.big { font-size: clamp(3rem, 14vw, 5rem); line-height: 1; }
.result.win .h.big { color: var(--green); }
.result.lose .h.big { color: var(--red); }
.score { font-family: var(--display); font-size: 1.5rem; }
.result p { margin: 0; font-size: 1.15rem; line-height: 1.5; }
.result .actions { width: 100%; }
.pop { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: scale(.6) rotate(-10deg); } to { transform: scale(1) rotate(-6deg); } }

/* 명단 */
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.filter { display: flex; gap: 6px; flex-wrap: wrap; }
.filter button { font-family: var(--display); font-size: 1rem; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--tile-sky); background: var(--card); }
.filter button[aria-pressed="true"] { background: var(--blue); color: var(--card); border-color: var(--blue); }
.count { font-family: var(--display); color: var(--violet); font-size: 1.2rem; }
.group { margin-top: 16px; }
.group h3 { font-family: var(--display); font-weight: 400; font-size: 1.2rem; margin: 0 0 8px; color: var(--teal); }
.names { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
.names li { background: var(--green-soft); border-radius: 12px; padding: 6px 12px; font-family: var(--display); font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
.names li .del { border: 0; background: none; color: var(--red); font-size: 1rem; padding: 0 2px; }
.empty { color: var(--ink-soft); text-align: center; padding: 24px 0; margin: 0; }
.store-note { color: var(--ink-soft); font-size: .9rem; margin: 10px 0 0; }
.confirm { margin-top: 10px; background: var(--red-soft); border-radius: 14px; padding: 10px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--display); }
.confirm button { font-family: var(--display); border-radius: 10px; padding: 6px 12px; border: 0; }
.confirm .yes { background: var(--red); color: var(--card); }
.confirm .no { background: var(--card); }

@media (max-width: 520px) {
  .pick.cls { grid-template-columns: repeat(3, 1fr); }
  .rules { grid-template-columns: 1fr; }
  .bigR b { font-size: 4rem; }
  .book-chips { font-size: 1.3rem; }
}
@media (prefers-reduced-motion: reduce) { .pop { animation: none; transform: rotate(-6deg); } .big-btn { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header id="topHeader" style="display:flex;flex-direction:column;gap:16px;align-items:center">
    <div class="made-by">필봉 <span class="ras"><span class="r">R</span><span class="a">A</span><span class="s">S</span></span> 자치회가 준비했어요!</div>
    <span class="pilbong">필봉</span>
    <div class="tiles" aria-label="필봉 키클 독서퀴즈">
      <div class="tile-group"><div class="tile t1">키</div><div class="tile t2">클</div></div>
      <div class="tile-group"><div class="tile t3">독</div><div class="tile t4">서</div><div class="tile t5">퀴</div><div class="tile t6">즈</div></div>
    </div>
  </header>

  <!-- 1. 시작 화면 -->
  <section id="home" style="display:flex;flex-direction:column;gap:18px">
    <div class="card book">
      <div class="bigR"><b>R</b><span>독서</span></div>
      <div class="book-chips"><span class="chip pink">키클</span><span class="chip blue">독서퀴즈</span></div>
      <h2 class="h book-title">&lt;슈퍼 토끼&gt; 읽고 퀴즈 도전!</h2>
      <div class="rules">
        <div class="rule">랜덤 3문제<small>8문제 중에서 골라요</small></div>
        <div class="rule">2문제 맞히면<small>성공!</small></div>
        <div class="rule">성공하면<small>명단에 이름이 올라가요</small></div>
      </div>
    </div>

    <form class="card form" id="startForm" novalidate>
      <div>
        <span class="field-label">학년</span>
        <div class="pick cls"><button type="button" aria-pressed="true" disabled>2학년</button></div>
      </div>
      <div>
        <span class="field-label" id="cLabel">반</span>
        <div class="pick cls" id="classPick" role="group" aria-labelledby="cLabel"></div>
      </div>
      <div>
        <label class="field-label" for="nameInput">이름</label>
        <input class="name-input" id="nameInput" maxlength="10" autocomplete="off" placeholder="이름을 써 주세요">
      </div>
      <p class="err" id="formErr" role="alert"></p>
      <button class="big-btn" type="submit">퀴즈 시작!</button>
    </form>

    <div class="sticker-bar">
      <div class="stamp mini" aria-hidden="true"><div class="top">필봉 키클 한마당</div><div class="mid"><b>R</b><span>독서퀴즈<br>도전성공</span></div></div>
      <div class="txt">
        <h2 class="h">성공한 친구 <span id="winCount">0</span>명</h2>
        <p>성공하면 독서퀴즈 스티커를 받아요</p>
      </div>
      <button class="link-btn" type="button" id="toList">명단 보기</button>
    </div>
  </section>

  <!-- 2. 퀴즈 화면 -->
  <section id="quiz" hidden>
    <div class="card">
      <div class="quiz-top">
        <span class="who" id="who"></span>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <div class="card" style="margin-top:18px" id="qCard"></div>
  </section>

  <!-- 3. 결과 화면 -->
  <section id="result" hidden>
    <div class="card result" id="resultCard"></div>
  </section>

  <!-- 4. 성공 명단 -->
  <section id="list" hidden>
    <div class="card">
      <div class="list-head">
        <h2 class="h" style="font-size:1.6rem">2학년 독서퀴즈 성공 명단</h2>
        <span class="count" id="listCount"></span>
      </div>
      <div class="filter" id="gradeFilter" style="margin-top:12px"></div>
      <div id="listBody"></div>
      <p class="store-note" id="storeNote"></p>
      <div class="actions"><button class="big-btn ghost" type="button" id="listBack">처음으로</button></div>
    </div>
  </section>
</div>

<script>
// ───────── 문제 (<슈퍼 토끼> 독서퀴즈 8문항) ─────────
const QUESTIONS = [
  { q: "<슈퍼 토끼>의 주인공 토끼 이름은 무엇인가요?", type: "mc",
    options: ["깡충이", "재빨라", "토순이", "번개"], answer: 1 },
  { q: "재빨라에게 달리기 경주를 신청한 거북이의 이름은 무엇인가요?", type: "mc",
    options: ["느림이", "엉금이", "꾸물이", "거북이"], answer: 2 },
  { q: "거북이와의 달리기 경주에서 진 재빨라는 다시는 무엇을 하지 않겠다고 마음먹었나요?", type: "mc",
    options: ["달리기", "노래하기", "잠자기", "밥 먹기"], answer: 0 },
  { q: "달리기를 그만둔 재빨라의 모습은 어떻게 변했나요?", type: "mc",
    options: ["몸이 더욱 튼튼해졌어요.", "키가 쑥쑥 자랐어요.", "털이 반짝반짝 빛났어요.", "눈이 침침해지고 털도 빠졌어요."], answer: 3 },
  { q: "병원에 가던 재빨라가 생각지도 않게 참여하게 된 것은 무엇인가요?", type: "mc",
    options: ["노래 대회", "달리기 대회", "그림 그리기 대회", "수영 대회"], answer: 1 },
  { q: "재빨라가 가장 행복하다고 느끼는 순간은 언제인가요?", type: "mc",
    options: ["맛있는 음식을 먹을 때", "낮잠을 잘 때", "신나게 달릴 때", "텔레비전을 볼 때"], answer: 2 },
  { q: "재빨라에게 해 주면 가장 어울리는 응원의 말은 무엇인가요?", type: "mc",
    options: ["한 번 졌으니 다시는 달리지 마!", "다른 친구와 비교하며 살아야 해!", "실수하면 무조건 포기해야 해!", "이기고 지는 것보다 좋아하는 일을 즐기는 게 중요해!"], answer: 3 },
  { q: "<슈퍼 토끼>를 쓰고 그림을 그린 작가는 누구인가요?", type: "mc",
    options: ["백희나", "유설화", "안녕달", "이지은"], answer: 1 },
];
const PICK = 3, PASS = 2;
const NUMS = ["①", "②", "③", "④", "⑤"];

// ───────── 상태 ─────────
const state = { grade: 2, cls: null, name: "", picked: [], idx: 0, results: [], selected: [] };
let winners = [];      // {id, grade, cls, name, at}


const $ = (id) => document.getElementById(id);
const show = (id) => { for (const s of ["home", "quiz", "result", "list"]) $(s).hidden = s !== id; $("topHeader").hidden = id === "quiz"; window.scrollTo(0, 0); };
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
};
const today = () => { const d = new Date(); return `${d.getMonth() + 1}. ${d.getDate()}.`; };

// ───────── 시작 화면 ─────────
function buildPick(box, count, suffix, key) {
  for (let i = 1; i <= count; i++) {
    const b = el("button", { type: "button", "aria-pressed": "false", text: i + suffix, id: `${key}-${i}` });
    b.addEventListener("click", () => {
      state[key] = i;
      for (const x of box.children) x.setAttribute("aria-pressed", String(x === b));
      $("formErr").textContent = "";
    });
    box.append(b);
  }
}
buildPick($("classPick"), 3, "반", "cls");

$("startForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("nameInput").value.trim();
  if (!state.cls) return ($("formErr").textContent = "반을 골라 주세요.");
  if (!name) { $("nameInput").focus(); return ($("formErr").textContent = "이름을 써 주세요."); }
  state.name = name;
  startQuiz();
});

// ───────── 퀴즈 ─────────
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startQuiz() {
  state.picked = shuffle(QUESTIONS.map((_, i) => i)).slice(0, PICK);
  state.idx = 0; state.results = [];
  $("who").textContent = `${state.grade}학년 ${state.cls}반 ${state.name}`;
  show("quiz");
  renderQuestion();
}

function renderDots() {
  const box = $("dots"); box.replaceChildren();
  for (let i = 0; i < PICK; i++) {
    let cls = "dot";
    if (i < state.results.length) cls += state.results[i] ? " ok" : " no";
    else if (i === state.idx) cls += " now";
    box.append(el("span", { class: cls, text: i < state.results.length ? (state.results[i] ? "O" : "X") : String(i + 1) }));
  }
}

function renderQuestion() {
  renderDots();
  const q = QUESTIONS[state.picked[state.idx]];
  state.selected = [];
  const card = $("qCard"); card.replaceChildren();
  const typeName = { mc: "골라요", ox: "O / X", multi: "2개 골라요" }[q.type];
  card.append(
    el("div", { class: "q-label" }, el("span", { class: "chip blue", text: `${state.idx + 1}번 문제` }), el("span", { class: "q-type", text: typeName })),
    el("h2", { class: "h q-text", text: q.q })
  );

  const actions = el("div", { class: "actions" });
  const check = el("button", { class: "big-btn", type: "button", text: "정답 확인" });
  check.disabled = true;

  if (q.type === "mc" || q.type === "multi") {
    const box = el("div", { class: "opts" });
    q.options.forEach((t, i) => {
      const b = el("button", { class: "opt", type: "button", "aria-pressed": "false" }, el("span", { class: "num", text: String(i + 1) }), el("span", { text: t }));
      b.addEventListener("click", () => {
        if (q.type === "mc") state.selected = [i];
        else {
          const at = state.selected.indexOf(i);
          if (at >= 0) state.selected.splice(at, 1);
          else { if (state.selected.length >= 2) state.selected.shift(); state.selected.push(i); }
        }
        [...box.children].forEach((x, j) => x.setAttribute("aria-pressed", String(state.selected.includes(j))));
        check.disabled = q.type === "multi" ? state.selected.length !== 2 : state.selected.length === 0;
      });
      box.append(b);
    });
    card.append(box);
    if (q.type === "multi") card.append(el("p", { class: "hint", text: "두 개를 모두 골라야 정답 확인을 누를 수 있어요." }));
  } else if (q.type === "ox") {
    const box = el("div", { class: "opts ox" });
    ["O", "X"].forEach((t, i) => {
      const b = el("button", { class: "opt", type: "button", "aria-pressed": "false", "aria-label": t === "O" ? "맞아요 O" : "틀려요 X", text: t });
      b.addEventListener("click", () => {
        state.selected = [i];
        [...box.children].forEach((x, j) => x.setAttribute("aria-pressed", String(j === i)));
        check.disabled = false;
      });
      box.append(b);
    });
    card.append(box);
  }

  check.addEventListener("click", () => grade(q, card, actions, check));
  actions.append(check);
  card.append(actions);
}

function isRight(q) {
  if (q.type === "multi") return state.selected.length === 2 && q.answers.every((a) => state.selected.includes(a));
  return state.selected[0] === q.answer;
}

function answerLabel(q) {
  if (q.type === "ox") return q.answer === 0 ? "O" : "X";
  if (q.type === "multi") return q.answers.map((a) => `${NUMS[a]} ${q.options[a]}`).join(", ");
  return `${NUMS[q.answer]} ${q.options[q.answer]}`;
}

function grade(q, card, actions, check) {
  const ok = isRight(q);
  state.results.push(ok);
  card.querySelectorAll(".opt").forEach((b, i) => {
    b.disabled = true;
    const correct = q.type === "multi" ? q.answers.includes(i) : i === q.answer;
    if (correct) b.classList.add("right");
    else if (state.selected.includes(i)) b.classList.add("wrong");
  });
  renderDots();

  const fb = el("div", { class: "feedback " + (ok ? "ok" : "no"), role: "status" },
    ok ? "딩동댕! 정답이에요." : "아쉬워요!",
    ok ? null : el("small", { text: `정답은 ${answerLabel(q)} 이에요.` }));
  actions.before(fb);

  const last = state.idx === PICK - 1;
  const next = el("button", { class: "big-btn green", type: "button", text: last ? "결과 보기" : "다음 문제" });
  next.addEventListener("click", () => { if (last) finish(); else { state.idx++; renderQuestion(); } });
  actions.replaceChildren(next);
  next.focus();
}

// ───────── 결과 ─────────
async function finish() {
  const score = state.results.filter(Boolean).length;
  const win = score >= PASS;
  const card = $("resultCard");
  card.className = "card result " + (win ? "win" : "lose");
  card.replaceChildren();
  const who = `${state.grade}학년 ${state.cls}반 ${state.name}`;

  if (win) {
    card.append(
      el("h2", { class: "h big", text: "성공!" }),
      el("div", { class: "score", text: `${PICK}문제 중 ${score}문제 맞혔어요` }),
      el("div", { class: "stamp pop" },
        el("div", { class: "top", text: "필봉 키클 한마당" }),
        el("div", { class: "mid" }, el("b", { text: "R" }), el("span", {}, "독서퀴즈", el("br"), "도전성공")),
        el("div", { class: "date", text: today() })),
      el("p", { text: `${who}, 축하해요! 선생님께 독서퀴즈 스티커를 받으세요.` })
    );
    const saved = await saveWinner();
    card.append(el("p", { class: saved ? "" : "err",
      text: saved ? "성공 명단에 이름을 올렸어요." : "명단에 저장하지 못했어요. 인터넷 연결을 확인하고 선생님께 알려 주세요." }));
  } else {
    card.append(
      el("h2", { class: "h big", text: "실패" }),
      el("div", { class: "score", text: `${PICK}문제 중 ${score}문제 맞혔어요` }),
      el("p", { text: `${who}, 아깝다! 2문제를 맞히면 성공이에요. 책을 한 번 더 읽고 다시 도전해 봐요.` })
    );
  }
  const actions = el("div", { class: "actions" });
  if (!win) actions.append(el("button", { class: "big-btn", type: "button", text: "다시 도전", onclick: startQuiz }));
  actions.append(el("button", { class: "big-btn " + (win ? "" : "ghost"), type: "button", text: "처음으로", onclick: resetHome }));
  card.append(actions);
  show("result");
}

function resetHome() {
  state.cls = null; state.name = "";
  $("nameInput").value = ""; $("formErr").textContent = "";
  document.querySelectorAll("#classPick button").forEach((b) => b.setAttribute("aria-pressed", "false"));
  show("home");
}

// ───────── 성공 명단 저장 (Supabase) ─────────
const SUPABASE_URL = "https://simowynbbpisnlmdlkhe.supabase.co";
const SUPABASE_KEY = "sb_publishable_UfzvR1LBAdiUNdqVwDhxsw_--u-lCQI";   // 브라우저용 공개 키
const API = SUPABASE_URL + "/rest/v1/winners";
const HEADERS = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };

async function loadWinners() {
  try {
    const r = await fetch(API + "?select=id,grade,cls,name,created_at&grade=eq.2&order=created_at.asc", { headers: HEADERS });
    if (!r.ok) throw new Error(r.status + " " + (await r.text()));
    winners = (await r.json()).map((w) => ({ ...w, at: w.created_at }));
    $("storeNote").textContent = "명단은 Supabase에 저장돼서 어느 기기에서나 똑같이 보여요. 잘못 들어간 이름은 Supabase 대시보드의 Table Editor에서 지워 주세요.";
  } catch (e) {
    console.warn("명단 불러오기 실패", e);
    $("storeNote").textContent = "명단을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.";
  }
  renderWinners();
}

// 성공 기록 저장. 같은 반에 같은 이름이 이미 있으면(409) 저장된 것으로 봐요.
async function saveWinner() {
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { ...HEADERS, Prefer: "return=minimal" },
      body: JSON.stringify({ grade: state.grade, cls: state.cls, name: state.name }),
    });
    if (!r.ok && r.status !== 409) throw new Error(r.status + " " + (await r.text()));
    loadWinners();
    return true;
  } catch (e) {
    console.warn("성공 기록 저장 실패", e);
    return false;
  }
}

let filterGrade = 0;
function renderWinners() {
  $("winCount").textContent = winners.length;
  const f = $("gradeFilter"); f.replaceChildren();
  ["전체", 1, 2, 3].forEach((c, i) => {
    f.append(el("button", { type: "button", "aria-pressed": String(filterGrade === i), text: i ? `${c}반` : c,
      onclick: () => { filterGrade = i; renderWinners(); } }));
  });
  const shown = winners.filter((w) => !filterGrade || w.cls === filterGrade);
  $("listCount").textContent = `${shown.length}명 성공`;
  const body = $("listBody"); body.replaceChildren();
  if (!shown.length) { body.append(el("p", { class: "empty", text: "아직 성공한 친구가 없어요. 첫 번째 주인공이 되어 보세요!" })); return; }
  const groups = new Map();
  for (const w of shown.slice().sort((a, b) => a.cls - b.cls || a.at.localeCompare(b.at))) {
    const k = `${w.grade}학년 ${w.cls}반`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(w);
  }
  for (const [k, list] of groups) {
    const ul = el("ul", { class: "names" });
    for (const w of list) ul.append(el("li", { text: w.name }));
    body.append(el("div", { class: "group" }, el("h3", { text: `${k} · ${list.length}명` }), ul));
  }
}

$("toList").addEventListener("click", () => { renderWinners(); show("list"); loadWinners(); });
$("listBack").addEventListener("click", () => show("home"));

$("storeNote").textContent = "명단을 불러오는 중이에요…";
renderWinners();
loadWinners();
